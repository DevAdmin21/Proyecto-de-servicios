<!DOCTYPE html>
<html lang="es">

<head>

 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width">

 <title>Formulario de contacto</title>

 <script type="module" src="js/lib/manejaErrores.js"></script>

</head>

<body>

 <h1>Formulario de contacto</h1>

 <form id="formulario">

  <p>
   <label>
    Artista:
    <select name="art_id" required>
     <option value="1">Alex Ink</option>
     <option value="2">Elena Moon</option>
     <option value="3">Victor Real</option>
    </select>
   </label>
  </p>

  <p>
   <label>
    Nombre:
    <input name="cit_cliente" required>
   </label>
  </p>

  <p>
   <label>
    Correo:
    <input type="email" name="cit_email" required>
   </label>
  </p>

  <p>
   <label>
    Descripción:
    <textarea name="cit_descripcion" required></textarea>
   </label>
  </p>

  <p>
   <label>
    Fecha:
    <input type="date" name="cit_fecha" required>
   </label>
  </p>

  <p><button type="submit">Procesa</button></p>

 </form>

 <script type="module">

  import { consume } from "./js/lib/consume.js"
  import { enviaFormRecibeJson } from "./js/lib/enviaFromRecibeJson.js"

  formulario.addEventListener("submit", submit)

  /**
   * @param {Event} event
   */
  async function submit(event) {
   event.preventDefault()
   const respuesta = await consume(
    enviaFormRecibeJson(
     "php/agregaCita.php", formulario))
   const json =
    await respuesta.json()
   alert(json)
  }

 </script>


</body>

</html>
