<body>

    <h1>Estudio de Tatuajes: Galería de Referencias</h1>

    <h2>Blackwork</h2>
    <div id="galeria-blackwork"></div>

    <h2>Color</h2>
    <div id="galeria-color"></div>

    <h2>Fineline</h2>
    <div id="galeria-fineline"></div>

    <footer>
        <p>&copy; 2025 InkFlow &mdash; Desarrollado por <strong>BitBang</strong></p>
    </footer>

    <script type="module">
        //Se importa la función de manejo de errores desde el módulo correspondiente
        import { muestraError } from "./js/lib/muestraError.js";

        // Credencial de acceso a la API de Unsplash
        const ACCESS_KEY = "sRGAGOgROoxHzYBwWggorWu7F_0yRb584SuDiHed-a4";

        // Estilos a mostrar, cada uno vinculado a su contenedor en el DOM
        const estilos = [
            { query: "blackwork tattoo", contenedorId: "galeria-blackwork" },
            { query: "color tattoo", contenedorId: "galeria-color" },
            { query: "fineline tattoo", contenedorId: "galeria-fineline" },
        ];

        // Construye la URL de búsqueda para un estilo dado
        function buildURL(query) {
            return `https://api.unsplash.com/search/photos?query=${encodeURIComponent(query)}&per_page=5&client_id=${ACCESS_KEY}`;
        }

        // Inserta las fotos de un estilo en su contenedor correspondiente
        async function cargarEstilo(query, contenedorId) {
            const contenedor = document.getElementById(contenedorId);


            // Solicitud GET a la API de Unsplash
            const respuesta = await fetch(buildURL(query), {
                headers: { "Accept": "application/json" }
            });

            // Si la respuesta no es 2xx, lanzamos un error con el mensaje del servidor
            if (!respuesta.ok) {
                throw new Error(`Error al obtener imágenes (${query}): ${respuesta.statusText}`);
            }

            const datos = await respuesta.json();

            // Iteramos cada foto del resultado y construimos su tarjeta en el DOM
            for (const foto of datos.results) {
                const figure = document.createElement("figure");

                // Imagen usando la versión "small" de Unsplash (~400px)
                const img = document.createElement("img");
                img.src = foto.urls.small;
                img.alt = foto.alt_description ?? `Tatuaje estilo ${query}`;
                img.width = 200;

                // Atribución requerida por los términos de uso de Unsplash
                const figcaption = document.createElement("figcaption");

                // Link al perfil del fotógrafo con parámetros UTM obligatorios
                const linkFotografo = document.createElement("a");
                linkFotografo.href = `${foto.user.links.html}?utm_source=inkflow&utm_medium=referral`;
                linkFotografo.target = "_blank";
                linkFotografo.innerText = foto.user.name;

                // Link a Unsplash con parámetros UTM obligatorios
                const linkUnsplash = document.createElement("a");
                linkUnsplash.href = "https://unsplash.com/?utm_source=inkflow&utm_medium=referral";
                linkUnsplash.target = "_blank";
                linkUnsplash.innerText = "Unsplash";

                // Formato: "Photo by [fotógrafo] on Unsplash"
                figcaption.append("Photo by ", linkFotografo, " on ", linkUnsplash);

                figure.appendChild(img);
                figure.appendChild(figcaption);
                contenedor.appendChild(figure);
            }


        }

        // Lanzamos las tres búsquedas en paralelo
        for (const { query, contenedorId } of estilos) {
            cargarEstilo(query, contenedorId);
        }
    </script>
</body>

</html>
